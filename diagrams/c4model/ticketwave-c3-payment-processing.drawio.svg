<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1400px" height="850px" viewBox="-0.5 -0.5 1400 850" content="&lt;mxfile host=&quot;drawio-plugin&quot; modified=&quot;2026-07-30T15:35:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;22.1.22&quot; etag=&quot;c3-payment-v1&quot; type=&quot;embed&quot;&gt;&lt;diagram id=&quot;c3-payment&quot; name=&quot;C3 Payment&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1168bd"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#82b366"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9673a6"/></marker>
  <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6b656"/></marker>
  <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/></filter>
</defs>
<text x="700" y="25" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a365d">Payment Processing — C3 Component Diagram</text>
<rect x="20" y="50" width="960" height="780" rx="12" ry="12" fill="none" stroke="#6c8ebf" stroke-width="3" filter="url(#sh)"/>
<text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6c8ebf">Payment Bounded Context</text>
<rect x="50" y="90" width="280" height="80" rx="10" ry="10" fill="#1168bd" stroke="#0b4884" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff">PaymentController</text>
<text x="190" y="130" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#ddd">@RestController @RequestMapping("/api/v1/payments")</text>
<text x="190" y="148" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#fff">POST payments/orders/{on} | POST .../{on}/refund</text>
<rect x="50" y="200" width="280" height="90" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#12315a">PaymentService (interface)</text>
<text x="190" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#12315a">processPayment(orderNumber, request)</text>
<text x="190" y="258" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#12315a">processRefund(orderNumber, request)</text>
<rect x="360" y="200" width="280" height="110" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#sh)"/>
<text x="500" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#12315a">StubPaymentService</text>
<text x="500" y="240" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">@Service implements PaymentService</text>
<text x="370" y="260" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">processPayment: validate PENDING → COMPLETED</text>
<text x="370" y="276" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a"> + publish PaymentCompletedEvent</text>
<text x="370" y="292" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">processRefund: status → REFUNDED</text>
<text x="370" y="308" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a"> + publish PaymentRefundedEvent</text>
<rect x="50" y="330" width="280" height="80" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">PaymentRepository</text>
<text x="190" y="370" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">«interface» extends JpaRepository</text>
<text x="60" y="390" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">findByOrderId(orderId)</text>
<rect x="50" y="450" width="280" height="90" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">Domain Events</text>
<text x="60" y="490" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">PaymentCompletedEvent</text>
<text x="60" y="506" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  paymentId, orderId, orderNumber, userId, amount</text>
<text x="60" y="522" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">PaymentRefundedEvent</text>
<text x="60" y="538" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  paymentId, orderId, orderNumber, amount</text>
<rect x="670" y="200" width="300" height="90" rx="10" ry="10" fill="#f5f5f5" stroke="#999" stroke-width="2" filter="url(#sh)"/>
<text x="820" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#666">External Dependencies</text>
<text x="820" y="242" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">OrderRepository (order lookup)</text>
<text x="820" y="260" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">DomainEventBus (event publishing)</text>
<rect x="670" y="330" width="300" height="100" rx="10" ry="10" fill="#1168bd" stroke="#0b4884" stroke-width="2" filter="url(#sh)"/>
<text x="820" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">PostgreSQL</text>
<text x="820" y="370" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">payments table</text>
<text x="820" y="388" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">order_id (unique) FK → orders</text>
<text x="820" y="406" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">status: PENDING / COMPLETED / FAILED / REFUNDED</text>
<rect x="50" y="580" width="580" height="230" rx="8" ry="8" fill="#f8f8f8" stroke="#ccc" stroke-width="2" filter="url(#sh)"/>
<text x="70" y="602" text-anchor="left" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a365d">Payment Orchestration via Events</text>
<text x="70" y="622" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">1. POST /api/v1/payments/orders/{orderNumber}</text>
<text x="70" y="638" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">2. StubPaymentService finds Order (must be PENDING)</text>
<text x="70" y="654" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">3. Creates Payment record with COMPLETED status</text>
<text x="70" y="670" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">4. Publishes PaymentCompletedEvent → DomainEventBus</text>
<text x="70" y="686" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">5. OrderEventHandler.onPaymentCompleted() fires:</text>
<text x="70" y="702" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#555">    5a. Calls OrderService.confirmOrder() → CONFIRMED</text>
<text x="70" y="718" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#555">    5b. Publishes OrderConfirmedEvent → DomainEventBus</text>
<text x="70" y="734" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">6. TicketEventHandler.onOrderConfirmed() fires:</text>
<text x="70" y="750" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#555">    6a. Calls TicketService.issueTickets(order)</text>
<text x="70" y="766" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#555">    6b. Publishes TicketsIssuedEvent → DomainEventBus</text>
<text x="70" y="782" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333"></text>
<text x="70" y="798" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">→ REFUND flow: POST .../{orderNumber}/refund sets REFUNDED</text>
<text x="70" y="814" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#555">  and publishes PaymentRefundedEvent</text>
<path d="M 190 170 L 190 200" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 330 245 L 360 255" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 190 290 L 190 330" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 190 410 L 190 450" fill="none" stroke="#d6b656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 640 255 L 670 245" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<path d="M 500 310 L 820 380" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>