<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1400px" height="950px" viewBox="-0.5 -0.5 1400 950" content="&lt;mxfile host=&quot;drawio-plugin&quot; modified=&quot;2026-07-30T15:35:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;22.1.22&quot; etag=&quot;c3-infrastructure-v1&quot; type=&quot;embed&quot;&gt;&lt;diagram id=&quot;c3-infra&quot; name=&quot;C3 Infrastructure&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1168bd"/></marker>
