<text x="705" y="277" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  Long userId</text>
<text x="705" y="275" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#d6b656">  routingKey: "order.confirmed"</text>
<rect x="690" y="300" width="370" height="95" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#sh)"/>
