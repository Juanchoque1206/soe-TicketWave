<text x="710" y="850" text-anchor="left" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a365d">Configuration (application.properties)</text>
<text x="710" y="870" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">eventbus.type=inmemory  (default, uses Spring Events)</text>
<text x="710" y="888" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">eventbus.type=rabbitmq (uses RabbitMQ, requires broker)</text>
