</defs>
<text x="700" y="25" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a365d">Domain Event Bus &amp; Infrastructure — C3 Component Diagram</text>
<rect x="20" y="50" width="620" height="870" rx="12" ry="12" fill="none" stroke="#6c8ebf" stroke-width="3" filter="url(#sh)"/>
<text x="330" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6c8ebf">Domain Event Bus Architecture</text>
<rect x="50" y="90" width="260" height="80" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="3" filter="url(#sh)"/>
<text x="180" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">DomainEventBus (interface)</text>
<text x="180" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">publish(DomainEvent event)</text>
<text x="180" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#888">«extends Serializable»</text>
<rect x="50" y="200" width="260" height="100" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#sh)"/>
<text x="180" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">InMemoryEventBus</text>
<text x="180" y="240" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">@ConditionalOnProperty( = "inmemory")</text>
<text x="180" y="258" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Wraps ApplicationEventPublisher</text>
<text x="180" y="276" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">Default (matchIfMissing = true)</text>
<rect x="340" y="200" width="260" height="100" rx="10" ry="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" filter="url(#sh)"/>
<text x="470" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">RabbitMQEventBus</text>
<text x="470" y="240" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">@ConditionalOnProperty( = "rabbitmq")</text>
<text x="470" y="258" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Uses RabbitTemplate.convertAndSend()</text>
<text x="470" y="276" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Routing: EXCHANGE + getRoutingKey()</text>
<rect x="50" y="340" width="550" height="160" rx="10" ry="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" filter="url(#sh)"/>
<text x="325" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">RabbitMQConfig</text>
<text x="325" y="380" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">@Configuration @ConditionalOnProperty(name="eventbus.type", havingValue="rabbitmq")</text>
<text x="70" y="400" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Exchange: ticketwave.events (DirectExchange)</text>
<text x="70" y="416" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Queues: ticketwave.order | ticketwave.payment | ticketwave.ticket | ticketwave.notification</text>
<text x="70" y="432" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="bold" fill="#666">Bindings (9 total):</text>
<text x="85" y="450" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">  order: order.submitted | order.confirmed | order.cancelled</text>
<text x="85" y="466" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">  payment: payment.completed | payment.refunded</text>
<text x="85" y="482" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">  ticket: ticket.issued | ticket.validated</text>
<text x="85" y="498" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">  notification: order.confirmed | order.cancelled</text>
<rect x="50" y="530" width="260" height="90" rx="10" ry="10" fill="#f5f5f5" stroke="#999" stroke-width="2" filter="url(#sh)"/>
<text x="180" y="552" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">SecurityConfig</text>
<text x="180" y="570" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">@Configuration @EnableWebSecurity</text>
<text x="60" y="590" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">CSRF off · STATELESS sessions</text>
<text x="60" y="606" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">HTTP Basic · BCrypt passwords</text>
<rect x="340" y="530" width="260" height="90" rx="10" ry="10" fill="#f5f5f5" stroke="#999" stroke-width="2" filter="url(#sh)"/>
<text x="470" y="552" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">JacksonConfig</text>
<text x="470" y="570" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">@Configuration</text>
<text x="470" y="590" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Jackson auto-configuration</text>
<text x="470" y="606" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">JSON ISO date serialization</text>
<rect x="670" y="50" width="710" height="870" rx="12" ry="12" fill="none" stroke="#d6b656" stroke-width="3" filter="url(#sh)"/>
<text x="1025" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d6b656">Domain Events (7 total)</text>
<rect x="690" y="90" width="370" height="95" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#sh)"/>
<text x="875" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">OrderSubmittedEvent</text>
<text x="875" y="126" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">extends AbstractDomainEvent</text>
<text x="705" y="144" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  Long orderId</text>
<text x="705" y="158" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  String orderNumber</text>
<text x="705" y="172" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  Long userId</text>
<text x="705" y="170" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#d6b656">  routingKey: "order.submitted"</text>
