<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1400px" height="950px" viewBox="-0.5 -0.5 1400 950" content="&lt;mxfile host=&quot;drawio-plugin&quot; modified=&quot;2026-07-30T15:30:00.000Z&quot; agent=&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36&quot; version=&quot;22.1.22&quot; etag=&quot;c2-eventflow-v1&quot; type=&quot;embed&quot;&gt;&lt;diagram id=&quot;c2-eventflow&quot; name=&quot;C2 Event Flow&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
  </marker>
  <filter id="shadow1" x="-5%" y="-5%" width="115%" height="115%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
  </filter>
</defs>
<text x="700" y="25" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a365d">TicketWave — Event Choreography (C2 Level 2)</text>
<rect x="50" y="55" width="170" height="60" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow1)"/>
<text x="135" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#12315a">Browser/Client</text>
<text x="135" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">User/External</text>
<line x1="135" y1="115" x2="135" y2="870" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="280" y="55" width="170" height="60" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow1)"/>
<text x="365" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#12315a">REST API
(Spring MVC)</text>
<line x1="365" y1="115" x2="365" y2="870" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="480" y="55" width="170" height="60" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow1)"/>
<text x="565" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#12315a">Order Context</text>
<text x="565" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">OrderService</text>
<line x1="565" y1="115" x2="565" y2="870" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="680" y="55" width="170" height="60" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow1)"/>
<text x="765" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#12315a">Payment Context</text>
<text x="765" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">PaymentService
StubPaymentService</text>
<line x1="765" y1="115" x2="765" y2="870" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="880" y="55" width="170" height="60" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow1)"/>
<text x="965" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#12315a">Ticket Context</text>
<text x="965" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">TicketService</text>
<line x1="965" y1="115" x2="965" y2="870" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="1080" y="55" width="170" height="60" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow1)"/>
<text x="1165" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#12315a">Notification</text>
<text x="1165" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">StubNotificationService</text>
<line x1="1165" y1="115" x2="1165" y2="870" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="1250" y="55" width="170" height="60" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow1)"/>
<text x="1335" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#12315a">Infrastructure</text>
<text x="1335" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">PostgreSQL
RabbitMQ</text>
<line x1="1335" y1="115" x2="1335" y2="870" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="280" y="155" width="700" height="80" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow1)"/>
<text x="292" y="177" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">1. Submit Order</text>
<text x="292" y="197" font-family="sans-serif" font-size="10" fill="#555">POST /api/orders
OrderCreateRequest</text>
<rect x="280" y="260" width="700" height="80" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#shadow1)"/>
<text x="292" y="282" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">2. Publish OrderSubmittedEvent</text>
<text x="292" y="302" font-family="sans-serif" font-size="10" fill="#555">DomainEventBus.publish()
routingKey: order.submitted</text>
<rect x="280" y="365" width="700" height="80" rx="10" ry="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" filter="url(#shadow1)"/>
<text x="292" y="387" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">3. Process Payment</text>
<text x="292" y="407" font-family="sans-serif" font-size="10" fill="#555">StubPaymentService.processPayment()
publishes PaymentCompletedEvent</text>
<rect x="280" y="470" width="700" height="80" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#shadow1)"/>
<text x="292" y="492" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">4. Confirm Order (via event handler)</text>
<text x="292" y="512" font-family="sans-serif" font-size="10" fill="#555">OrderEventHandler listens to
PaymentCompletedEvent
calls OrderService.confirmOrder()</text>
<rect x="280" y="575" width="700" height="80" rx="10" ry="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2" filter="url(#shadow1)"/>
<text x="292" y="597" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">5. Issue Tickets (via event handler)</text>
<text x="292" y="617" font-family="sans-serif" font-size="10" fill="#555">TicketEventHandler listens to
OrderConfirmedEvent
calls TicketService.issueTickets()</text>
<rect x="280" y="680" width="700" height="80" rx="10" ry="10" fill="#f8cecc" stroke="#b85450" stroke-width="2" filter="url(#shadow1)"/>
<text x="292" y="702" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">6. Send Notifications</text>
<text x="292" y="722" font-family="sans-serif" font-size="10" fill="#555">NotificationEventHandler listens to
OrderConfirmedEvent
calls StubNotificationService.send*()</text>
<rect x="280" y="785" width="700" height="80" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow1)"/>
<text x="292" y="807" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">7. Return Response</text>
<text x="292" y="827" font-family="sans-serif" font-size="10" fill="#555">HTTP 201 Created
OrderResponse with orderNumber</text>
<line x1="630" y1="235" x2="630" y2="260" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="630" y1="340" x2="630" y2="365" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="630" y1="445" x2="630" y2="470" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="630" y1="550" x2="630" y2="575" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="630" y1="655" x2="630" y2="680" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="630" y1="760" x2="630" y2="785" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="365" cy="225" r="12" fill="#d6b656" stroke="#d6b656" stroke-width="2"/>
<text x="383" y="229" font-family="sans-serif" font-size="10" font-weight="bold" fill="#333">OrderSubmittedEvent</text>
<circle cx="565" cy="310" r="12" fill="#d6b656" stroke="#d6b656" stroke-width="2"/>
<circle cx="765" cy="415" r="12" fill="#d79b00" stroke="#d79b00" stroke-width="2"/>
<text x="783" y="419" font-family="sans-serif" font-size="10" font-weight="bold" fill="#333">PaymentCompletedEvent</text>
<circle cx="565" cy="520" r="12" fill="#9673a6" stroke="#9673a6" stroke-width="2"/>
<text x="583" y="524" font-family="sans-serif" font-size="10" font-weight="bold" fill="#333">OrderConfirmedEvent</text>
<circle cx="965" cy="625" r="12" fill="#82b366" stroke="#82b366" stroke-width="2"/>
<text x="983" y="629" font-family="sans-serif" font-size="10" font-weight="bold" fill="#333">TicketsIssuedEvent</text>
<circle cx="1165" cy="730" r="12" fill="#b85450" stroke="#b85450" stroke-width="2"/>
<text x="1183" y="734" font-family="sans-serif" font-size="10" font-weight="bold" fill="#333">Notifications sent</text>
<rect x="50" y="680" width="200" height="280" rx="10" ry="10" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
<text x="70" y="702" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a365d">Domain Events (7 total)</text>
<text x="70" y="722" font-family="sans-serif" font-size="10" fill="#333">OrderSubmittedEvent - orderId,</text>
<text x="70" y="736" font-family="sans-serif" font-size="10" fill="#333">  orderNumber, userId</text>
<text x="70" y="750" font-family="sans-serif" font-size="10" fill="#333">OrderConfirmedEvent - orderId,</text>
<text x="70" y="764" font-family="sans-serif" font-size="10" fill="#333">  orderNumber, userId</text>
<text x="70" y="778" font-family="sans-serif" font-size="10" fill="#333">OrderCancelledEvent - orderId,</text>
<text x="70" y="792" font-family="sans-serif" font-size="10" fill="#333">  orderNumber, userId</text>
<text x="70" y="806" font-family="sans-serif" font-size="10" fill="#333">PaymentCompletedEvent - paymentId,</text>
<text x="70" y="820" font-family="sans-serif" font-size="10" fill="#333">  orderId, orderNumber, userId, amount</text>
<text x="70" y="834" font-family="sans-serif" font-size="10" fill="#333">PaymentRefundedEvent - paymentId,</text>
<text x="70" y="848" font-family="sans-serif" font-size="10" fill="#333">  orderId, orderNumber, amount</text>
<text x="70" y="862" font-family="sans-serif" font-size="10" fill="#333">TicketsIssuedEvent - orderId,</text>
<text x="70" y="876" font-family="sans-serif" font-size="10" fill="#333">  orderNumber, userId, ticketIds</text>
<text x="70" y="890" font-family="sans-serif" font-size="10" fill="#333">TicketValidatedEvent - ticketId,</text>
<text x="70" y="904" font-family="sans-serif" font-size="10" fill="#333">  ticketCode, orderId</text>
<text x="70" y="918" font-family="sans-serif" font-size="10" fill="#333"></text>
<text x="70" y="932" font-family="sans-serif" font-size="10" fill="#333">Event Bus: InMemoryEventBus (default)</text>
<text x="70" y="946" font-family="sans-serif" font-size="10" fill="#333">  or RabbitMQEventBus</text>
<text x="70" y="960" font-family="sans-serif" font-size="10" fill="#333">Routing: 9 routing keys -> 4 queues</text>
<text x="70" y="974" font-family="sans-serif" font-size="10" fill="#333">  -> 3 handlers</text>
</svg>