<text x="360" y="662" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">Event Choreography Flow</text>
<text x="360" y="682" font-family="sans-serif" font-size="11" fill="#333">① Order → submit → OrderSubmittedEvent</text>
<text x="360" y="700" font-family="sans-serif" font-size="11" fill="#333">② Payment → complete → PaymentCompletedEvent</text>
<text x="360" y="718" font-family="sans-serif" font-size="11" fill="#333">③ Order → confirm → OrderConfirmedEvent</text>
<text x="360" y="736" font-family="sans-serif" font-size="11" fill="#333">④ Ticket → issue → TicketsIssuedEvent</text>
<text x="360" y="754" font-family="sans-serif" font-size="11" fill="#333">⑤ Notification → send confirmations</text>
<text x="360" y="772" font-family="sans-serif" font-size="11" fill="#333">────────────────────────────────────</text>
<text x="360" y="790" font-family="sans-serif" font-size="11" fill="#333">7 Events: OrderSubmitted, OrderConfirmed,</text>
<text x="360" y="806" font-family="sans-serif" font-size="11" fill="#333">OrderCancelled, PaymentCompleted,</text>
<text x="360" y="822" font-family="sans-serif" font-size="11" fill="#333">PaymentRefunded, TicketsIssued, TicketValidated</text>
