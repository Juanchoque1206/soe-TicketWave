<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1400px" height="850px" viewBox="-0.5 -0.5 1400 850" content="&lt;mxfile host=&quot;drawio-plugin&quot; modified=&quot;2026-07-30T15:35:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;22.1.22&quot; etag=&quot;c3-ticket-v1&quot; type=&quot;embed&quot;&gt;&lt;diagram id=&quot;c3-ticket&quot; name=&quot;C3 Ticket&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1168bd"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#82b366"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9673a6"/></marker>
  <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6b656"/></marker>
  <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/></filter>
</defs>
<text x="700" y="25" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a365d">Ticket Management — C3 Component Diagram</text>
<rect x="20" y="50" width="960" height="780" rx="12" ry="12" fill="none" stroke="#6c8ebf" stroke-width="3" filter="url(#sh)"/>
<text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6c8ebf">Ticket Bounded Context</text>
<rect x="50" y="90" width="280" height="80" rx="10" ry="10" fill="#1168bd" stroke="#0b4884" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff">TicketController</text>
<text x="190" y="130" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#ddd">@RestController @RequestMapping("/api/v1/tickets")</text>
<text x="190" y="148" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#fff">GET /tickets | GET /tickets/{code} | POST .../{code}/validate</text>
<rect x="50" y="200" width="600" height="120" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#sh)"/>
<text x="350" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#12315a">TicketService</text>
<text x="350" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#888">@Service @Transactional</text>
<text x="70" y="262" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• issueTickets(order) — create Ticket per OrderItem w/ UUID ticketCode, VALID status</text>
<text x="70" y="278" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• findByUser(userId) — list user tickets</text>
<text x="70" y="294" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• findByTicketCode(ticketCode) — lookup by QR code</text>
<text x="70" y="310" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• validateTicket(ticketCode) — VALID → USED, record validatedAt timestamp</text>
<rect x="50" y="350" width="280" height="90" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">TicketRepository</text>
<text x="190" y="390" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">«interface» extends JpaRepository</text>
<text x="60" y="412" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">findByTicketCode / findByUserId / findByOrderId</text>
<rect x="50" y="470" width="280" height="100" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="490" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">Domain Events</text>
<text x="60" y="510" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">TicketsIssuedEvent</text>
<text x="60" y="526" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  orderId, orderNumber, userId, ticketIds</text>
<text x="60" y="542" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">TicketValidatedEvent</text>
<text x="60" y="558" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  ticketId, ticketCode, orderId</text>
<rect x="360" y="470" width="280" height="100" rx="10" ry="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" filter="url(#sh)"/>
<text x="500" y="492" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">TicketEventHandler</text>
<text x="500" y="510" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">@Component @TransactionalEventListener</text>
<text x="370" y="530" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">onOrderConfirmed(OrderConfirmedEvent)</text>
<text x="370" y="548" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  → load Order → issueTickets()</text>
<text x="370" y="564" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  → publish TicketsIssuedEvent</text>
<rect x="670" y="200" width="300" height="90" rx="10" ry="10" fill="#f5f5f5" stroke="#999" stroke-width="2" filter="url(#sh)"/>
<text x="820" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#666">External Dependencies</text>
<text x="820" y="242" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">OrderRepository (order lookup)</text>
<text x="820" y="260" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">DomainEventBus (event publishing)</text>
<rect x="670" y="350" width="300" height="100" rx="10" ry="10" fill="#1168bd" stroke="#0b4884" stroke-width="2" filter="url(#sh)"/>
<text x="820" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">PostgreSQL</text>
<text x="820" y="390" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">tickets table</text>
<text x="820" y="408" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">ticket_code (unique) — QR/barcode</text>
<text x="820" y="426" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">order_item_id (unique FK) → order_items</text>
<rect x="50" y="600" width="920" height="200" rx="8" ry="8" fill="#f8f8f8" stroke="#ccc" stroke-width="2" filter="url(#sh)"/>
<text x="70" y="622" text-anchor="left" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a365d">Ticket Lifecycle &amp; Choreography</text>
<text x="70" y="642" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">1. Order confirmed → TicketEventHandler.onOrderConfirmed() fires (async after commit)</text>
<text x="70" y="658" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">2. Order loaded from DB; for each OrderItem, creates a Ticket:</text>
<text x="70" y="674" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">     - ticketCode = UUID.randomUUID() (unique, used as QR/barcode)</text>
<text x="70" y="690" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">     - status = VALID, issuedAt = now()</text>
<text x="70" y="706" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">3. Publishes TicketsIssuedEvent with all created ticket IDs</text>
<text x="70" y="722" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">4. User can look up tickets via GET /api/v1/tickets/{ticketCode}</text>
<text x="70" y="738" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">5. Venue operator validates at gate → POST .../{ticketCode}/validate</text>
<text x="70" y="754" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">     - status VALID → USED, validatedAt = now()</text>
<text x="70" y="770" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">     - Publishes TicketValidatedEvent</text>
<text x="70" y="786" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">6. Ticket status state: VALID → USED | CANCELLED | REFUNDED</text>
<path d="M 190 170 L 350 200" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 350 320 L 190 350" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 190 440 L 190 470" fill="none" stroke="#d6b656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 330 520 L 360 520" fill="none" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 640 245 L 670 245" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<path d="M 500 440 L 820 400" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>