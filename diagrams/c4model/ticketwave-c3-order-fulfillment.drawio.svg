<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1400px" height="950px" viewBox="-0.5 -0.5 1400 950" content="&lt;mxfile host=&quot;drawio-plugin&quot; modified=&quot;2026-07-30T15:35:00.000Z&quot; agent=&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36&quot; version=&quot;22.1.22&quot; etag=&quot;c3-order-fulfillment-v1&quot; type=&quot;embed&quot;&gt;&lt;diagram id=&quot;c3-order&quot; name=&quot;C3 Order Fulfillment&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1168bd"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#82b366"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9673a6"/></marker>
  <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6b656"/></marker>
  <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/></filter>
</defs>
<text x="700" y="25" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a365d">Order Fulfillment — C3 Component Diagram</text>
<rect x="20" y="50" width="960" height="870" rx="12" ry="12" fill="none" stroke="#6c8ebf" stroke-width="3" filter="url(#sh)"/>
<text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6c8ebf">Order Bounded Context</text>
<rect x="50" y="90" width="280" height="80" rx="10" ry="10" fill="#1168bd" stroke="#0b4884" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff">OrderController</text>
<text x="190" y="133" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#ddd">@RestController @RequestMapping("/api/v1/orders")</text>
<text x="190" y="148" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#fff">POST /orders | GET /orders | POST /orders/{on}/cancel</text>
<rect x="360" y="90" width="180" height="80" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#sh)"/>
<text x="450" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#12315a">DTOs (records)</text>
<text x="450" y="133" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">OrderCreateRequest</text>
<text x="450" y="148" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">OrderResponse / OrderItemResponse</text>
<rect x="50" y="200" width="600" height="130" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#sh)"/>
<text x="350" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#12315a">OrderService</text>
<text x="350" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#888">@Service — @Transactional</text>
<text x="70" y="258" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">createOrder(userId, request) — fraud check, seat reserve, promotion, publish OrderSubmittedEvent</text>
<text x="70" y="276" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">confirmOrder(orderId) — status PENDING -> CONFIRMED</text>
<text x="70" y="294" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">cancelOrder(orderNumber, userId) — status -> CANCELLED, decrement inventory, publish OrderCancelledEvent</text>
<rect x="50" y="360" width="280" height="100" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">OrderRepository</text>
<text x="190" y="396" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">«interface» extends JpaRepository</text>
<text x="60" y="415" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">• findByUserIdOrderByCreatedAtDesc</text>
<text x="60" y="431" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">• findByOrderNumber</text>
<text x="60" y="447" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">• countByUserIdAndStatusAndCreatedAtAfter</text>
<rect x="360" y="360" width="280" height="100" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#sh)"/>
<text x="500" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">OrderItemRepository</text>
<text x="500" y="396" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">«interface» extends JpaRepository</text>
<text x="370" y="415" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">• findByOrderId</text>
<text x="370" y="431" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">• findActiveBySeatAndEvent</text>
<rect x="50" y="490" width="280" height="120" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="512" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">Domain Events</text>
<text x="70" y="534" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">▸ OrderSubmittedEvent — orderId, orderNumber, userId</text>
<text x="70" y="554" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">▸ OrderConfirmedEvent — orderId, orderNumber, userId</text>
<text x="70" y="574" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">▸ OrderCancelledEvent — orderId, orderNumber, userId</text>
<rect x="360" y="490" width="280" height="100" rx="10" ry="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" filter="url(#sh)"/>
<text x="500" y="512" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">OrderEventHandler</text>
<text x="500" y="530" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">@Component @TransactionalEventListener</text>
<text x="500" y="550" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">onPaymentCompleted(PaymentCompletedEvent)</text>
<text x="500" y="566" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">→ confirmOrder() → publish OrderConfirmedEvent</text>
<rect x="670" y="200" width="300" height="100" rx="10" ry="10" fill="#f5f5f5" stroke="#999" stroke-width="2" filter="url(#sh)"/>
<text x="820" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#666">External Services</text>
<text x="820" y="242" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">UserService (findEntityByEmail)</text>
<text x="820" y="260" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">PromotionService (validate, calculateDiscount)</text>
<rect x="670" y="360" width="300" height="100" rx="10" ry="10" fill="#1168bd" stroke="#0b4884" stroke-width="2" filter="url(#sh)"/>
<text x="820" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">PostgreSQL</text>
<text x="820" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">orders · order_items tables</text>
<text x="820" y="418" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">event_id / ticket_type_id / seat_id FK</text>
<rect x="670" y="490" width="300" height="90" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="3" filter="url(#sh)"/>
<text x="820" y="512" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">DomainEventBus</text>
<text x="820" y="530" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">InMemoryEventBus | RabbitMQEventBus</text>
<text x="820" y="548" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">publish(event) → handlers or RabbitMQ</text>
<rect x="670" y="620" width="300" height="175" rx="8" ry="8" fill="#f8f8f8" stroke="#ccc" stroke-width="2" filter="url(#sh)"/>
<text x="690" y="642" text-anchor="left" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a365d">Legend</text>
<rect x="690" y="652" width="12" height="12" rx="2" ry="2" fill="#1168bd" stroke="#0b4884" stroke-width="1.5"/>
<text x="708" y="662" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Controller (API boundary)</text>
<rect x="690" y="672" width="12" height="12" rx="2" ry="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="708" y="682" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Service (business logic)</text>
<rect x="690" y="692" width="12" height="12" rx="2" ry="2" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="708" y="702" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Repository (data access)</text>
<rect x="690" y="712" width="12" height="12" rx="2" ry="2" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="708" y="722" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Event (domain event)</text>
<rect x="690" y="732" width="12" height="12" rx="2" ry="2" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="708" y="742" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Handler (event listener)</text>
<rect x="690" y="752" width="12" height="12" rx="2" ry="2" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
<text x="708" y="762" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">External dependency</text>
<rect x="690" y="772" width="12" height="12" rx="2" ry="2" fill="#1168bd" stroke="#0b4884" stroke-width="1.5"/>
<text x="708" y="782" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">Database / Infrastructure</text>
<rect x="50" y="640" width="580" height="155" rx="8" ry="8" fill="#f8f8f8" stroke="#ccc" stroke-width="2" filter="url(#sh)"/>
<text x="70" y="662" text-anchor="left" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a365d">Order Creation Flow</text>
<text x="70" y="682" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">1. POST /api/v1/orders → OrderController.create()</text>
<text x="70" y="698" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">2. Fraud check: max 5 PENDING orders per user in last 10 min</text>
<text x="70" y="714" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">3. For each item: incrementSoldQuantity, check seat availability</text>
<text x="70" y="730" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">4. Apply promotion (validate + calculateDiscount + redeem)</text>
<text x="70" y="746" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">5. Save Order (PENDING) with generated UUID orderNumber</text>
<text x="70" y="762" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">6. Publish OrderSubmittedEvent → DomainEventBus</text>
<text x="70" y="778" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">7. Payment processing continues in Payment context...</text>
<path d="M 190 170 L 350 200" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#666">delegates</text>
<path d="M 350 330 L 190 360" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="342" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#666">queries</text>
<path d="M 350 330 L 190 490" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="440" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#d6b656">publish(OrderSubmitted)</text>
<path d="M 330 550 L 360 540" fill="none" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 500 490 L 350 300" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 650 265 L 670 265" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<text x="660" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#666">depends</text>
<path d="M 500 460 L 820 360" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 330 550 L 670 535" fill="none" stroke="#d6b656" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
</svg>