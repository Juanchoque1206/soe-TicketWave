<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1400px" height="880px" viewBox="-0.5 -0.5 1400 880" content="&lt;mxfile host=&quot;drawio-plugin&quot; modified=&quot;2026-07-30T15:35:00.000Z&quot; agent=&quot;Mozilla/5.0&quot; version=&quot;22.1.22&quot; etag=&quot;c3-event-management-v1&quot; type=&quot;embed&quot;&gt;&lt;diagram id=&quot;c3-event&quot; name=&quot;C3 Event Management&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1168bd"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#82b366"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9673a6"/></marker>
  <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6b656"/></marker>
  <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/></filter>
</defs>
<text x="700" y="25" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a365d">Event Management — C3 Component Diagram</text>
<rect x="20" y="50" width="960" height="800" rx="12" ry="12" fill="none" stroke="#6c8ebf" stroke-width="3" filter="url(#sh)"/>
<text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6c8ebf">Event Bounded Context</text>
<rect x="50" y="90" width="280" height="80" rx="10" ry="10" fill="#1168bd" stroke="#0b4884" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff">EventController</text>
<text x="190" y="130" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#ddd">@RestController @RequestMapping("/api/v1/events")</text>
<text x="190" y="148" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#fff">POST/GET/PUT events | PATCH cancel|postpone</text>
<rect x="50" y="200" width="600" height="150" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#sh)"/>
<text x="350" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#12315a">EventService</text>
<text x="350" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#888">@Service @Transactional</text>
<text x="70" y="260" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• create(request) — create Event + TicketTypes from request</text>
<text x="70" y="276" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• update(id, request) — partial update with status transition validation</text>
<text x="70" y="292" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• findById(id) — single event lookup</text>
<text x="70" y="308" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• search(city, artist, venueId, from, to, paging) — paged PUBLISHED search</text>
<text x="70" y="324" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• cancel(id) — validate DRAFT/PUBLISHED -> CANCELLED</text>
<text x="70" y="340" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#12315a">• postpone(id, newDate) — validate PUBLISHED -> POSTPONED</text>
<rect x="50" y="380" width="280" height="90" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">EventRepository</text>
<text x="190" y="420" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">«interface» extends JpaRepository</text>
<text x="60" y="442" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">searchEvents(@Param status, city, artist, venueId, fromDate, toDate)</text>
<rect x="360" y="380" width="280" height="90" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#sh)"/>
<text x="500" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">TicketTypeRepository</text>
<text x="500" y="420" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#888">«interface» extends JpaRepository</text>
<text x="370" y="442" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">incrementSoldQuantity / decrementSoldQuantity</text>
<rect x="50" y="500" width="280" height="100" rx="10" ry="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2" filter="url(#sh)"/>
<text x="190" y="520" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">Entities</text>
<text x="70" y="540" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">▸ Event (name, description, category, status,</text>
<text x="70" y="556" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">▸   eventDate, salesStartDate, salesEndDate, venue)</text>
<text x="70" y="572" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">▸ TicketType (name, price, totalQuantity,</text>
<text x="70" y="588" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">▸   soldQuantity, event, section)</text>
<rect x="360" y="500" width="280" height="110" rx="10" ry="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2" filter="url(#sh)"/>
<text x="500" y="520" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">Status State Machine</text>
<text x="370" y="540" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  DRAFT → PUBLISHED | CANCELLED</text>
<text x="370" y="556" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  PUBLISHED → POSTPONED | CANCELLED | COMPLETED</text>
<text x="370" y="572" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  POSTPONED → PUBLISHED | CANCELLED</text>
<text x="370" y="588" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  CANCELLED → (none)</text>
<text x="370" y="604" text-anchor="left" font-family="sans-serif" font-size="9" font-weight="normal" fill="#333">  COMPLETED → (none)</text>
<rect x="670" y="200" width="300" height="100" rx="10" ry="10" fill="#f5f5f5" stroke="#999" stroke-width="2" filter="url(#sh)"/>
<text x="820" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#666">External Dependencies</text>
<text x="820" y="242" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">VenueRepository (venue lookup)</text>
<text x="820" y="260" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#666">SectionRepository (section lookup)</text>
<rect x="670" y="360" width="300" height="100" rx="10" ry="10" fill="#1168bd" stroke="#0b4884" stroke-width="2" filter="url(#sh)"/>
<text x="820" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">PostgreSQL</text>
<text x="820" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">events · ticket_types tables</text>
<text x="820" y="418" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="normal" fill="#ddd">venue_id FK → venues</text>
<rect x="50" y="640" width="580" height="190" rx="8" ry="8" fill="#f8f8f8" stroke="#ccc" stroke-width="2" filter="url(#sh)"/>
<text x="70" y="662" text-anchor="left" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a365d">Event Lifecycle &amp; Business Rules</text>
<text x="70" y="682" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">1. Event created as DRAFT — invisible to customers</text>
<text x="70" y="698" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">2. Organizer publishes → PUBLISHED — visible in search</text>
<text x="70" y="714" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">3. Can postpone (PUBLISHED) or cancel (DRAFT/PUBLISHED)</text>
<text x="70" y="730" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">4. Search exposes only PUBLISHED events (filtered in JPQL)</text>
<text x="70" y="746" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">5. Sales window determined by salesStartDate / salesEndDate</text>
<text x="70" y="762" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">6. Ticket types define pricing tiers with total/sold quantities</text>
<text x="70" y="778" text-anchor="left" font-family="sans-serif" font-size="10" font-weight="normal" fill="#333">7. Atomic incrementSoldQuantity prevents overselling</text>
<path d="M 190 170 L 350 200" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#666">delegates</text>
<path d="M 350 350 L 190 380" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="362" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#666">queries</text>
<path d="M 650 275 L 670 275" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<text x="660" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="normal" fill="#666">depends</text>
<path d="M 500 470 L 820 410" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>